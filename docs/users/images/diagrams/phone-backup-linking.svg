<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Inter, Segoe UI, Arial, sans-serif">
  <!-- Drawn inline by the app in the reader's theme (classes styled in
       apps/web/src/styles/about.css); this <style> is the fallback GitHub uses. -->
  <style>
    .d-box { fill: #f4f6f8; stroke: #c9d2da; }
    .d-hot { fill: #e4f5f7; stroke: #1a8f9a; }
    .d-flow { fill: none; stroke: #1a8f9a; stroke-width: 2; }
    .d-dash { fill: none; stroke: #7a8794; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .d-arrow { fill: #1a8f9a; }
    .d-lbl { fill: #1f2937; font-size: 13px; font-weight: 650; }
    .d-sub { fill: #5b6775; font-size: 11.5px; }
    .d-mono { fill: #1a8f9a; font-family: Consolas, monospace; font-size: 11.5px; }
    .d-admin { fill: #a2742c; font-size: 11.5px; font-weight: 650; }
  </style>
  <defs>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="d-arrow" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="20" width="170" height="78" rx="12"/>
  <text class="d-lbl" x="26" y="46">The old app</text>
  <text class="d-sub" x="26" y="66">Immich, say: already</text>
  <text class="d-sub" x="26" y="84">backed the phone up</text>

  <rect class="d-box" x="10" y="140" width="170" height="78" rx="12"/>
  <text class="d-lbl" x="26" y="166">Your phone</text>
  <text class="d-sub" x="26" y="186">PhotoSync, first backup</text>
  <text class="d-sub" x="26" y="204">sends everything it has</text>

  <rect class="d-box" x="250" y="20" width="215" height="78" rx="12"/>
  <text class="d-lbl" x="266" y="46">Family photo library</text>
  <text class="d-sub" x="266" y="66">holds those photos</text>
  <text class="d-admin" x="266" y="86">linked to the phone by an admin</text>
  <path class="d-dash" d="M180 59 L248 59"/>

  <rect class="d-hot" x="250" y="140" width="200" height="78" rx="12"/>
  <text class="d-lbl" x="266" y="166">iSputnik server</text>
  <text class="d-sub" x="266" y="186">is this photo in a</text>
  <text class="d-sub" x="266" y="204">linked library already?</text>
  <path class="d-flow" d="M180 179 L248 179" marker-end="url(#pl-arrow)"/>
  <path class="d-dash" d="M350 98 L350 138"/>

  <rect class="d-box" x="560" y="20" width="330" height="78" rx="12"/>
  <text class="d-lbl" x="578" y="46">Yes: counted as backed up</text>
  <text class="d-sub" x="578" y="66">nothing stored twice; deleting it from the family</text>
  <text class="d-sub" x="578" y="84">library later doesn't bring it back</text>

  <rect class="d-hot" x="560" y="140" width="330" height="78" rx="12"/>
  <text class="d-lbl" x="578" y="166">No: stored in My library</text>
  <text class="d-mono" x="578" y="186">Phone/2026/2026-11-05</text>
  <text class="d-sub" x="578" y="204">as with any phone backup</text>

  <path class="d-flow" d="M450 168 C500 160, 510 70, 558 62" marker-end="url(#pl-arrow)"/>
  <path class="d-flow" d="M450 190 L558 190" marker-end="url(#pl-arrow)"/>
</svg>
