name: Build & publish Docker image

# Tags publish an image. Pushes to main and pull requests build the same image and
# throw it away — packaging is the one thing typecheck, tests and check:ui can't
# catch, and it used to surface only at release time: v2.4.0 and v2.4.1 were tagged,
# failed to build (the Dockerfile didn't copy docs/users, which the web build reads),
# and published nothing. A dry run turns that into a red mark on an ordinary commit.
#
# Pull requests build for the same reason one step earlier. A dependency bump can
# carry a NATIVE module without saying so — npm audit fix once moved onnxruntime-node
# 1.27→1.29 while claiming to patch adm-zip — and nothing else in CI compiles against
# the Linux image. Without this, a Dependabot PR goes green on CodeQL alone and the
# packaging check happens only after it lands on main.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    # …except for the release commit itself. A release pushes to main and then
    # pushes the tag, seconds apart: two events, one tree, two full image builds,
    # the first of which is a dry run of exactly what the second is about to
    # publish. Only the tag's build runs for those. Every other commit on main
    # still gets its dry run, which is the whole point of building on main.
    # Release commits are always subject-prefixed "release: " (docs/architecture.md
    # → Release process); a release committed under any other subject simply builds
    # twice again, as it did before.
    #
    # The head_commit test is spelled as a push-only clause on purpose: only a push
    # event HAS head_commit, and on a pull request it would resolve to the empty
    # string and pass by accident rather than by intent.
    if: github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # No LFS: the face recogniser is fetched from a release asset during the
        # build (see scripts/fetch-face-model.mjs). Pulling it through LFS here is
        # what exhausted the repo's LFS budget and failed every build at checkout.

      - name: Is this a release?
        id: release
        run: echo "publish=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"

      # The runner's default builder uses the plain "docker" driver, which cannot
      # export a cache ("Cache export is not supported for the docker driver").
      # buildx's container driver can, and the layer cache below needs it.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Only a release needs the registry — a dry run never pushes, so it needs no
      # credentials at all.
      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build${{ steps.release.outputs.publish == 'true' && ' and push' || ' (dry run)' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.release.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The ref this image is built from, so the app's Help links resolve to
          # the matching guides. A tag run gives "v2.3.1"; a manual dispatch gives
          # the branch name — either way a ref that exists on GitHub. A pull
          # request gives "35/merge", which does not, but only a published image
          # is ever read for Help links and a pull request never publishes.
          build-args: |
            DOCS_REF=${{ github.ref_name }}
          # Layers are shared between the dry runs and the release build, so the
          # extra main-branch builds mostly reuse work instead of repeating it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
