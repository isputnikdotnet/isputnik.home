name: Build & publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # No LFS: the face recogniser is fetched from a release asset during the
        # build (see scripts/fetch-face-model.mjs). Pulling it through LFS here is
        # what exhausted the repo's LFS budget and failed every build at checkout.

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The ref this image is built from, so the app's Help links resolve to
          # the matching guides. A tag run gives "v2.3.1"; a manual dispatch gives
          # the branch name — either way a ref that exists on GitHub.
          build-args: |
            DOCS_REF=${{ github.ref_name }}
