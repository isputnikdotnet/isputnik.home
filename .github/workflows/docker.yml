name: Build & publish Docker image

# Tags publish an image. Pushes to main build the same image and throw it away —
# packaging is the one thing typecheck, tests and check:ui can't catch, and it used
# to surface only at release time: v2.4.0 and v2.4.1 were tagged, failed to build
# (the Dockerfile didn't copy docs/users, which the web build reads), and published
# nothing. A dry run on main turns that into a red mark on an ordinary commit.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # No LFS: the face recogniser is fetched from a release asset during the
        # build (see scripts/fetch-face-model.mjs). Pulling it through LFS here is
        # what exhausted the repo's LFS budget and failed every build at checkout.

      - name: Is this a release?
        id: release
        run: echo "publish=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"

      # The runner's default builder uses the plain "docker" driver, which cannot
      # export a cache ("Cache export is not supported for the docker driver").
      # buildx's container driver can, and the layer cache below needs it.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only a release needs the registry — a dry run never pushes, so it needs no
      # credentials at all.
      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build${{ steps.release.outputs.publish == 'true' && ' and push' || ' (dry run)' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.release.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The ref this image is built from, so the app's Help links resolve to
          # the matching guides. A tag run gives "v2.3.1"; a manual dispatch gives
          # the branch name — either way a ref that exists on GitHub.
          build-args: |
            DOCS_REF=${{ github.ref_name }}
          # Layers are shared between the dry runs and the release build, so the
          # extra main-branch builds mostly reuse work instead of repeating it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
