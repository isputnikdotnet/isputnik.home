name: Bug report
description: Something in the app behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This project changes fast, so please check you are
        on the latest release before filing — a fair number of bugs are already
        fixed.

        **Do not report security problems here.** Use the
        [Security tab](https://github.com/isputnikdotnet/isputnik.home/security)
        instead — see [SECURITY.md](https://github.com/isputnikdotnet/isputnik.home/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Went to …
        2. Clicked …
        3. Expected … but the page showed …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the app under **Control panel → About**.
      placeholder: "2.11.9"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Unraid (Community Applications template)
        - Docker / docker-compose
        - Running from source (npm run dev)
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Audiobooks
        - Ebooks / reader
        - Gallery (photos & videos)
        - Family tree
        - Library scanning
        - Uploads
        - Users, sharing & permissions
        - Control panel
        - Backups & storage
        - Mobile / PWA / offline
        - Deployment & Docker
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Browser and device
      description: Only if the problem is in the interface.
      placeholder: "Firefox 141 on Windows 11 / installed PWA on iPhone"

  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: >
        From **Control panel → Logs**, or `docker logs` for the container.
        Include the lines from around the time the problem happened. This is
        rendered as a code block, so no backticks needed.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Screenshots, the folder layout if it is a scanning problem, or the file
        that triggered it. Please redact anything private first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest release, and the problem still happens
          required: true
        - label: I searched existing issues, including closed ones
          required: true
